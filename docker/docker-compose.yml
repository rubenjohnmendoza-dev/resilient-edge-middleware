name: rem-local

x-rem-build: &rem-build
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  rem:
    <<: *rem-build
    command:
      - pnpm
      - exec
      - wrangler
      - dev
      - --ip
      - 0.0.0.0
      - --port
      - "8787"
      - --local
      - --show-interactive-dev-session=false
      - --var
      - CHAOS_MODE:true
    ports:
      - "8787:8787"
    environment:
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true

  mock-webhook:
    <<: *rem-build
    command: ["node", "docker/mock-webhook.mjs"]
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    init: true

  chaos:
    <<: *rem-build
    profiles: ["chaos"]
    command: ["pnpm", "chaos"]
    depends_on:
      rem:
        condition: service_healthy
      mock-webhook:
        condition: service_healthy
    environment:
      REM_URL: "http://rem:8787"
      WEBHOOK_URL: "http://mock-webhook:8788"
      CHAOS_SEED: "${CHAOS_SEED:-20261020}"
      CHAOS_SPIKE_REQUESTS: "${CHAOS_SPIKE_REQUESTS:-60}"
      CHAOS_BURSTS: "${CHAOS_BURSTS:-3}"
    restart: "no"
