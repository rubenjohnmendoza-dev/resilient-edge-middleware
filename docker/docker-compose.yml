name: rem-local

x-rem-build: &rem-build
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  pocketbase:
    image: ghcr.io/pocketbase/pocketbase:latest
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    restart: unless-stopped

  stirling-pdf:
    image: frooodle/s-pdf:latest
    ports:
      - "8080:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
    restart: unless-stopped

  rem:
    <<: *rem-build
    command:
      - pnpm
      - exec
      - wrangler
      - dev
      - --ip
      - 0.0.0.0
      - --port
      - "8787"
      - --local
      - --show-interactive-dev-session=false
      - --var
      - CHAOS_MODE:true
      - --var
      - "POCKETBASE_URL:http://pocketbase:8090"
      - --var
      - "POCKETBASE_ADMIN_EMAIL:${POCKETBASE_ADMIN_EMAIL:-admin@rem.local}"
      - --var
      - "POCKETBASE_ADMIN_PASSWORD:${POCKETBASE_ADMIN_PASSWORD:-rem-local-dev-password}"
      - --var
      - "POCKETBASE_IDEMPOTENCY_COLLECTION:idempotency_keys"
      - --var
      - "POCKETBASE_AUDIT_COLLECTION:request_audit_logs"
      - --var
      - "POCKETBASE_TELEMETRY_COLLECTION:telemetry_metrics"
      - --var
      - "STIRLING_PDF_URL:http://stirling-pdf:8080"
    ports:
      - "8787:8787"
    environment:
      WRANGLER_SEND_METRICS: "false"
      POCKETBASE_URL: "http://pocketbase:8090"
      POCKETBASE_ADMIN_EMAIL: "${POCKETBASE_ADMIN_EMAIL:-admin@rem.local}"
      POCKETBASE_ADMIN_PASSWORD: "${POCKETBASE_ADMIN_PASSWORD:-rem-local-dev-password}"
      POCKETBASE_IDEMPOTENCY_COLLECTION: "idempotency_keys"
      POCKETBASE_AUDIT_COLLECTION: "request_audit_logs"
      POCKETBASE_TELEMETRY_COLLECTION: "telemetry_metrics"
      STIRLING_PDF_URL: "http://stirling-pdf:8080"
    depends_on:
      pocketbase:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true

  mock-webhook:
    <<: *rem-build
    command: ["node", "docker/mock-webhook.mjs"]
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    init: true

  chaos:
    <<: *rem-build
    profiles: ["chaos"]
    command: ["pnpm", "chaos"]
    depends_on:
      rem:
        condition: service_healthy
      mock-webhook:
        condition: service_healthy
    environment:
      REM_URL: "http://rem:8787"
      WEBHOOK_URL: "http://mock-webhook:8788"
      CHAOS_SEED: "${CHAOS_SEED:-20261020}"
      CHAOS_SPIKE_REQUESTS: "${CHAOS_SPIKE_REQUESTS:-60}"
      CHAOS_BURSTS: "${CHAOS_BURSTS:-3}"
    restart: "no"

volumes:
  pocketbase_data:
